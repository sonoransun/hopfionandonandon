[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopfion"
version = "0.2.0"
description = "Laser-driven hopfion simulation with manufacturing-style recipe pipeline and QC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
jax = ["jax>=0.4", "jaxlib>=0.4"]
viz = ["pyvista>=0.42"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ipykernel",
    "jupyter",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
hopfion = "hopfion.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741", "E731", "B008"]

[tool.mypy]
files = ["src/hopfion/physics", "src/hopfion/pipeline"]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
