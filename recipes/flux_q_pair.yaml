name: flux_q_pair
description: |
  Q± hopfion pair drifting under uniform spin-transfer torque. Total Q_H = 0,
  but the two centroids should drift together along u. Tests Eulerian flux
  conservation and Lagrangian centroid tracking simultaneously.

grid:
  nx: 64
  ny: 64
  nz: 48
  dx: 0.3
  bc: periodic

material:
  A_ex: 1.0
  D: 1.5
  Ku: 0.7
  easy_axis: [0, 0, 1]
  H_ext: [0, 0, 0]

initial:
  kind: q_pair
  R: 1.2
  separation: 5.0
  axis_of_separation: x
  direction: [0, 0, 1]

run:
  - kind: dynamics_stt
    n_steps: 200
    dt: 0.002
    alpha: 0.2
    gamma: 1.0
    u: [0.0, 0.0, 0.08]
    beta: 0.05

qc:
  fail_on:
    - norm_drift_below:        {tol: 1.0e-10}
  warn_on:
    - hopf_index_within:       {target: 0.0, tol: 0.5}
    - drift_bound:             {max_v: 1.0}

io:
  out: runs/flux_q_pair/
  extended_metrics: true
  write_report: true

seed: 0
backend: numpy
