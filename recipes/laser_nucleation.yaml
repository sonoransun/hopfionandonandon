name: laser_nucleation_thermal
description: |
  Phase-A laser nucleation via a white-noise thermal burst (the stand-in for
  the two-temperature model in Phase B2). The thermal step heats the spin
  field to chaotic, and the subsequent damped relax crystallizes a Q_H ≈ 1
  texture from the cooldown. Stochastic — yield depends on seed.

grid:
  nx: 48
  ny: 48
  nz: 48
  dx: 0.3
  bc: periodic

material:
  A_ex: 1.0
  D: 1.5
  Ku: 0.7
  easy_axis: [0, 0, 1]
  H_ext: [0, 0, 0]

initial:
  kind: uniform
  direction: [0, 0, 1]

run:
  - kind: thermal_burst
    n_steps: 60
    dt: 0.002
    alpha: 0.1
    gamma: 1.0
    kT: 15.0
  - kind: relax
    n_steps: 300
    dt: 0.002

qc:
  fail_on:
    - norm_drift_below:        {tol: 1.0e-10}
  warn_on:
    - hopf_index_within:       {target: 1.0, tol: 0.5}
    - runtime_within:          {max_seconds: 30}

io:
  out: runs/laser_nucleation_thermal/

seed: 0
backend: numpy
