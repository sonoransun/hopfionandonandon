name: single_hopfion_q1
description: |
  Phase-A baseline. Build an analytic Q_H=1 hopfion ansatz and relax under
  exchange + DMI + uniaxial anisotropy. Within the D=1.5, K_u=0.7 stability
  window, the relaxation lands on a nearby Q_H=1 local minimum.

grid:
  nx: 48
  ny: 48
  nz: 48
  dx: 0.3
  bc: periodic

material:
  A_ex: 1.0
  D: 1.5
  Ku: 0.7
  easy_axis: [0, 0, 1]
  H_ext: [0, 0, 0]

initial:
  kind: hopfion
  R: 1.5
  p: 1
  q: 1

run:
  - kind: relax
    n_steps: 250
    dt: 0.002

qc:
  fail_on:
    - energy_monotonicity: {tol: 1.0e-6}
    - hopf_index_within:   {target: 1.0, tol: 0.05}
    - norm_drift_below:    {tol: 1.0e-10}
  warn_on:
    - runtime_within:      {max_seconds: 30}

io:
  out: runs/single_hopfion_q1/
  snapshots_every: 0
  write_report: true

seed: 0
backend: numpy
