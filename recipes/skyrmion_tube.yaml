name: skyrmion_tube
description: |
  A stand-alone 2D Bloch skyrmion extruded along z, relaxed under damped LLG.
  The skyrmion number N_sk is a 2D topological invariant (Pontryagin charge),
  tracked first-class alongside the Hopf index. For this profile N_sk ≈ -1
  (set skyrmion_vorticity: -1 for an antiskyrmion with N_sk ≈ +1). The relaxed
  texture is topologically protected: N_sk stays put while the energy settles.

grid:
  nx: 64
  ny: 64
  nz: 24
  dx: 0.3
  bc: periodic

material:
  A_ex: 1.0
  D: 1.5
  Ku: 0.5
  easy_axis: [0, 0, 1]
  H_ext: [0, 0, 0]

initial:
  kind: skyrmion
  skyrmion_radius: 1.5
  skyrmion_helicity: 1.5707963267948966   # π/2 (Bloch)
  skyrmion_vorticity: 1                    # +1 skyrmion, -1 antiskyrmion

run:
  - kind: relax
    n_steps: 100
    dt: 0.002

qc:
  fail_on:
    - norm_drift_below:           {tol: 1.0e-10}
    - skyrmion_number_drift_below: {tol: 0.1}
  warn_on:
    - skyrmion_number_within:     {target: -1.0, tol: 0.1}
    - energy_monotonicity:        {tol: 1.0e-6}

io:
  out: runs/skyrmion_tube/
  extended_metrics: true

seed: 0
backend: numpy
