name: sot_drive
description: |
  Spin-orbit-torque switching demo. A uniform state tilted away from +z is driven
  by a damping-like SOT with polarization along +z; the torque relaxes the
  magnetization toward the polarization axis (the SOT-MRAM switching mechanism).
  A field-like component can be added via sot_fl.

grid:
  nx: 24
  ny: 24
  nz: 24
  dx: 0.5
  bc: periodic

material:
  A_ex: 1.0
  D: 0.0
  Ku: 0.3
  easy_axis: [0, 0, 1]
  H_ext: [0, 0, 0]

initial:
  kind: uniform
  direction: [0.6, 0.0, 0.8]      # tilted away from the +z easy axis

run:
  - kind: dynamics_sot
    n_steps: 200
    dt: 0.01
    gamma: 1.0
    alpha: 0.1
    sot_p: [0, 0, 1]              # polarization along +z
    sot_dl: 0.5                    # damping-like (drives m -> +z)
    sot_fl: 0.0

qc:
  fail_on:
    - norm_drift_below:  {tol: 1.0e-10}
  warn_on:
    - hopf_index_within: {target: 0.0, tol: 0.1}

io:
  out: runs/sot_drive/

seed: 0
backend: numpy
